# This rule is not used by the project treebind itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the treebind.example.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/managed-by: kustomize
  name: treebind-editor-role
rules:
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/status
  verbs:
  - get
