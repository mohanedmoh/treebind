## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  ## Number of manager replicas. Leader election (the --leader-elect argument
  ## below) lets one of them reconcile at a time; the others wait for the lease and
  ## take over when the leader goes away. Set it to 1 to run a single replica.
  ##
  replicas: 2

  image:
    repository: ghcr.io/mohanedmoh/treebind-operator
    ## Image tag (defaults to "v" plus Chart.appVersion if not set). Pin a digest
    ## by putting it in the repository instead: repository: <name>@sha256:...
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments. Keep --leader-elect while manager.replicas is above 1: the chart
  ## refuses to render without it, because every replica would reconcile at once.
  ## The operator reads the issuer of the cluster's service account tokens from the
  ## API server at start. On a cluster where that document cannot be read, add
  ## --status-issuer=<issuer> here, and --status-subject=<system:serviceaccount:ns:name>
  ## if the operator should not work out its own service account.
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy. An update starts the new replica and waits for it to be
  ## ready before it stops an old one, so the number of ready replicas never drops
  ## below the replica count.
  ##
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  ## PodDisruptionBudget for the manager pods. It lets a node drain evict one
  ## replica at a time. maxUnavailable, and not minAvailable, so that a single
  ## replica never has a budget of zero that blocks every drain.
  ##
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints. The default prefers to put the replicas on
  ## different nodes. The rule is soft (ScheduleAnyway), so both replicas still
  ## schedule on a cluster with one node. Counting only the pods of the same
  ## revision (pod-template-hash) keeps the replicas apart across an update too.
  ## The values go through tpl, so the label selector can use the chart's helpers.
  ## Set it to [] to leave the placement to the scheduler.
  ##
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: '{{ include "treebind.name" . }}'
          control-plane: controller-manager
      matchLabelKeys:
        - pod-template-hash

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

