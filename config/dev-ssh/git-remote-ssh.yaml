# The Secret git-remote-ssh-authorized, with the key that may log in, is made by
# hack/dev-ssh.sh before this is applied.
#
# This pod runs sshd as root, which sshd needs to log a user in, so it is for a throwaway dev
# cluster only. The namespace is the one of config/dev.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/managed-by: kustomize
  name: treebind-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-remote-ssh
  namespace: treebind-dev
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/component: git-remote-ssh
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: treebind
      app.kubernetes.io/component: git-remote-ssh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: treebind
        app.kubernetes.io/component: git-remote-ssh
    spec:
      containers:
      - name: sshd
        image: alpine:3.22
        command:
        - sh
        - -ec
        - |
          apk add --no-cache --quiet openssh-server git
          adduser -D -h /home/git -s /bin/sh git
          # Alpine leaves the account locked, and sshd refuses a locked account even for a key.
          sed -i 's/^git:!:/git:*:/' /etc/shadow
          mkdir -p /home/git/.ssh
          cp /etc/dev-authorized/authorized_keys /home/git/.ssh/authorized_keys
          chmod 700 /home/git/.ssh
          chmod 600 /home/git/.ssh/authorized_keys
          ssh-keygen -A
          git init --bare --initial-branch=main /srv/sample.git
          chown -R git:git /home/git /srv
          exec /usr/sbin/sshd -D -e -p 2222 \
            -o PasswordAuthentication=no -o AuthenticationMethods=publickey -o PermitRootLogin=no
        ports:
        - containerPort: 2222
          name: ssh
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: ssh
          initialDelaySeconds: 5
          periodSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 32Mi
        volumeMounts:
        - name: authorized
          mountPath: /etc/dev-authorized
          readOnly: true
        - name: data
          mountPath: /srv
      volumes:
      - name: authorized
        secret:
          secretName: git-remote-ssh-authorized
      - name: data
        emptyDir: {}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: git-remote-ssh
  namespace: treebind-dev
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/component: git-remote-ssh
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/component: git-remote-ssh
  ports:
  - name: ssh
    port: 22
    targetPort: ssh
    protocol: TCP
