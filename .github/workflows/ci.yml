name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

# Least privilege by default; a job asks for more only where it needs it.
permissions:
  contents: read

# Pull requests cancel their own earlier runs. Runs on main never cancel: each
# push has its own group (the commit SHA), so a queued run is never replaced.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing runs until the owner approves. The "ci" environment requires the
  # owner as reviewer, so this job pauses; on the pull request, open the Checks
  # tab and choose "Review pending deployments". Every other job waits for it,
  # so one approval starts the whole run.
  approve:
    name: approve
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Approved to run
        run: echo "Approved."

  # Decides whether the slow end-to-end suite is needed. A pull request that
  # touches only documentation and repository metadata skips it.
  changes:
    name: changes
    needs: approve
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" \
            | grep -qvE '^(docs/|.*\.md$|LICENSE$|NOTICE$|\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|pull_request_template\.md$))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

      - name: Go module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generated files are up to date
        run: |
          make generate manifests
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'make generate manifests' and commit the result."
            git status --short
            git diff
            exit 1
          fi

  unit:
    name: unit
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Everything except the cluster suites: envtest has its own job and
      # test/e2e needs kind.
      - name: Run unit tests
        run: go test $(go list ./... | grep -v -e '/test/e2e' -e '/internal/controller')

  envtest:
    name: envtest
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run reconciler tests against a real API server
        run: make test

  build:
    name: build (${{ matrix.arch }})
    needs: approve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Binaries go to a scratch directory: with a single main package, a bare
      # `go build ./cmd/...` would try to write a file called "cmd" over the
      # cmd/ directory.
      - name: Build every binary under cmd/
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/bin/" ./cmd/...

  # The release builds the images with ko. This job runs the same build on the
  # pull request commit without pushing, so a broken image build fails here and
  # not on the release tag. KO_DOCKER_REPO only names the images: nothing is
  # pushed, and no registry credentials are involved. The import paths come
  # from go list, so the job follows the main packages under cmd/ as they move.
  image:
    name: image
    needs: approve
    runs-on: ubuntu-latest
    env:
      # The same ko and cosign as release.yml, pinned by version and by the
      # SHA-256 of the download.
      KO_VERSION: "0.19.1"
      KO_SHA256: 635ac6ea3fd376c935fee597fbb29ab2c2449f49ef1655085fe3aa9c25fed7a5
      COSIGN_VERSION: v3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install ko and cosign
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSLo ko.tar.gz "https://github.com/ko-build/ko/releases/download/v${KO_VERSION}/ko_${KO_VERSION}_Linux_x86_64.tar.gz"
          echo "${KO_SHA256}  ko.tar.gz" | sha256sum -c -
          tar -xzf ko.tar.gz ko
          curl -fsSLo cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          echo "$tools" >> "$GITHUB_PATH"

      # The agent is built on a base image from Chainguard. A digest that changes
      # in .ko.yaml is checked here, in the pull request that changes it.
      - name: Verify the base image of the agent
        run: |
          set -euo pipefail
          source hack/retry.sh
          retry 3 hack/verify-agent-base.sh

      - name: Build both images for linux/amd64 and linux/arm64 without pushing
        env:
          KO_DOCKER_REPO: ci.invalid/treebind
        run: |
          set -euo pipefail
          ko build --push=false --platform=linux/amd64,linux/arm64 $(go list ./cmd/...)

      # The agent has to run Git and ssh as its user, with the settings of the sync
      # pod. This loads the amd64 image into the runner's Docker and runs it.
      - name: Run the agent image with the settings of the sync pod
        env:
          KO_DOCKER_REPO: ko.local
        run: |
          set -euo pipefail
          image="$(ko build --local --bare --platform=linux/amd64 ./cmd/agent)"
          hack/check-agent-image.sh "$image"

  # Every commit needs a Signed-off-by line. Dependabot does not add one, so
  # its pull requests skip the job; a job skipped by its own condition counts
  # as passing, which keeps the required check satisfied.
  dco:
    name: dco
    needs: approve
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off on every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: hack/check-dco.sh "$BASE" "$HEAD"

  # The pull request title becomes the commit on main (squash merge), so it
  # must follow Conventional Commits. The title is passed through the
  # environment, never interpolated into the script.
  pr-title:
    name: pr-title
    needs: approve
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\((operator|agent|api|git|volume|lock|chart|adapters|ci|docs)\))?!?: .+$'
          if [ "${#TITLE}" -gt 72 ]; then
            echo "Title is ${#TITLE} characters; keep it within 72."
            exit 1
          fi
          if ! printf '%s\n' "$TITLE" | grep -qE "$pattern"; then
            echo "Title does not follow Conventional Commits:"
            echo "  type(scope): short summary in the imperative"
            echo "Types: feat, fix, docs, test, refactor, perf, build, ci, chore"
            echo "Scopes: operator, agent, api, git, volume, lock, chart, adapters, ci, docs"
            exit 1
          fi

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  # The only required check besides dco. A required job that a path filter
  # skips would stay pending and block the merge; this gate treats a skipped
  # job as passing and fails only on a failure or a cancellation.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [approve, changes, lint, unit, envtest, build, image, dco, pr-title, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
