apiVersion: treebind.example.org/v1alpha1
kind: Treebind
metadata:
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/managed-by: kustomize
  name: treebind-sample
spec:
  repository:
    url: ssh://git@github.com/acme/dashboards.git
    branch: main
    # An ssh:// repository needs both references, because host keys are always
    # verified. Create the ConfigMap from the host's keys:
    #   ssh-keyscan github.com > known_hosts
    #   kubectl create configmap git-known-hosts --from-file=known_hosts
    auth:
      sshKeySecretRef:
        name: dashboards-deploy-key
        key: id_ed25519
      knownHostsConfigMapRef:
        name: git-known-hosts
        key: known_hosts
  target:
    claimName: grafana-data
    subPath: dashboards
    mountPath: /work
  sync:
    direction: bidirectional
    interval: 30s
    settleTime: 5s
    conflictPolicy: followRemote
  commit:
    authorName: treebind
    authorEmail: treebind@example.org
    messageTemplate: "treebind: sync {{ .Count }} file(s)"
  paths:
    exclude:
      - "*.tmp"
      - "*.swp"
  placement:
    mode: standalone
  # The agent block is accepted but not implemented yet, so it stays commented out.
