name: e2e

# Called by ci.yml on every code change and by nightly.yml once per supported
# Kubernetes version. The default is the newest version under test.
on:
  workflow_call:
    inputs:
      kubernetes:
        description: Kubernetes minor version, used in the job name
        type: string
        default: "1.37"
      node-image:
        description: kind node image, pinned by digest
        type: string
        default: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (kubernetes ${{ inputs.kubernetes }})
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256_AMD64: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_CLUSTER: treebind-test-e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      # The Makefile reuses a cluster that already exists, so creating it here
      # with the requested node image is enough.
      - name: Create the kind cluster
        env:
          NODE_IMAGE: ${{ inputs.node-image }}
        run: kind create cluster --name "$KIND_CLUSTER" --image "$NODE_IMAGE" --wait 120s

      - name: Run the end-to-end suite
        run: make test-e2e

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          mkdir -p kind-logs
          kind export logs kind-logs --name "$KIND_CLUSTER" || true
          kubectl --context "kind-${KIND_CLUSTER}" get pods -A -o wide || true

      - name: Upload cluster logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-${{ inputs.kubernetes }}
          path: kind-logs
          retention-days: 7

      - name: Delete the kind cluster
        if: always()
        run: make cleanup-test-e2e
