{{- if .Values.rbac.volumeRead.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "treebind.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "treebind.resourceName" (dict "suffix" "volume-read-rolebinding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "treebind.resourceName" (dict "suffix" "volume-read-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "treebind.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
