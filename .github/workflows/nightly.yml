name: Nightly

# Runs the end-to-end suite against every Kubernetes version in the support
# window (1.35 to 1.37). It is manual for now: start it from the Actions tab
# with "Run workflow". To run it every night again, add back
#   schedule:
#     - cron: "17 3 * * *"
# under `on:` (scheduled runs happen on the default branch only).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (kubernetes ${{ matrix.kubernetes }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.35"
            node-image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: "1.36"
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      kubernetes: ${{ matrix.kubernetes }}
      node-image: ${{ matrix.node-image }}

  # A red nightly becomes an issue. One open issue is kept up to date instead
  # of a new one every night.
  report:
    name: report failure
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "nightly: end-to-end tests failing"
    steps:
      - name: Open or update the failure issue
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$REPO" --state open --label area/ci \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label "kind/bug,area/ci,needs-triage" \
              --body "The nightly end-to-end run failed: $RUN_URL"
          else
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing: $RUN_URL"
          fi
