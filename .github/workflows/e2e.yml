name: e2e

# Called by ci.yml on every code change and by nightly.yml once per supported
# Kubernetes version. The default is the newest version under test. With
# failures: true it runs the specs that cause a failure on purpose (the label
# failure, `make test-e2e-failures`) and not the others, on a cluster of its own,
# so that a pull request waits for the longer of the two jobs and not for their
# sum. With chart: true it runs no spec of the suite: it installs the Helm chart
# on the cluster and syncs a Treebind through it (`make test-chart`). With
# quickstart: true it runs no spec either: it runs the commands of the quickstart
# and of the worked examples of docs/ as a reader does (`make test-quickstart`).
on:
  workflow_call:
    inputs:
      kubernetes:
        description: Kubernetes minor version, used in the job name
        type: string
        default: "1.37"
      node-image:
        description: kind node image, pinned by digest
        type: string
        default: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      failures:
        description: Run the specs that cause a failure (make test-e2e-failures) and not the others
        type: boolean
        default: false
      chart:
        description: Install the Helm chart and sync through it (make test-chart) instead of running the suite
        type: boolean
        default: false
      quickstart:
        description: Run the commands of docs/quickstart.md and docs/examples/ (make test-quickstart) instead of the suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.quickstart && 'quickstart' || inputs.chart && 'chart install' || format('e2e{0}', inputs.failures && ' failures' || '') }} (kubernetes ${{ inputs.kubernetes }})
    runs-on: ubuntu-latest
    # The suite has its own timeouts (30 minutes, and 60 for the failures); this one is for a job that hangs outside it. The
    # install of the chart and the quickstart have none of their own, and take a few minutes and about ten, so their limit is
    # short.
    timeout-minutes: ${{ (inputs.chart || inputs.quickstart) && 30 || inputs.failures && 90 || 45 }}
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256_AMD64: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_CLUSTER: treebind-test-e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256_AMD64}  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          kind version

      # The Makefile reuses a cluster that already exists, so creating it here
      # with the requested node image is enough.
      - name: Create the kind cluster
        env:
          NODE_IMAGE: ${{ inputs.node-image }}
        run: kind create cluster --name "$KIND_CLUSTER" --image "$NODE_IMAGE" --wait 120s

      # setup-go pins the toolchain that go.mod names and sets GOTOOLCHAIN=local, and the ko that the suite builds the agent
      # image with needs a newer Go than that to be built. The toolchain that it asks for is allowed for this step only,
      # and the suite finds bin/ko built.
      - name: Install ko
        run: GOTOOLCHAIN=auto make ko

      - name: Run the end-to-end suite, the install of the chart or the quickstart
        env:
          TARGET: ${{ inputs.quickstart && 'test-quickstart' || inputs.chart && 'test-chart' || inputs.failures && 'test-e2e-failures' || 'test-e2e' }}
        run: make "$TARGET"

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          mkdir -p kind-logs
          kind export logs kind-logs --name "$KIND_CLUSTER" || true
          kubectl --context "kind-${KIND_CLUSTER}" get pods -A -o wide || true

      - name: Upload cluster logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-${{ inputs.kubernetes }}${{ inputs.failures && '-failures' || '' }}${{ inputs.chart && '-chart' || '' }}${{ inputs.quickstart && '-quickstart' || '' }}
          path: kind-logs
          retention-days: 7

      - name: Delete the kind cluster
        if: always()
        run: make cleanup-test-e2e
