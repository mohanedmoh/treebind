{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: treebinds.treebind.example.org
spec:
  group: treebind.example.org
  names:
    kind: Treebind
    listKind: TreebindList
    plural: treebinds
    singular: treebind
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Treebind is the Schema for the treebinds API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Treebind
            properties:
              commit:
                description: commit controls the commits created from local edits.
                properties:
                  authorEmail:
                    description: authorEmail is the email recorded as the author of
                      every commit.
                    type: string
                  authorName:
                    description: authorName is the name recorded as the author of
                      every commit.
                    type: string
                  messageTemplate:
                    description: messageTemplate is the commit message, as a Go text/template.
                    type: string
                type: object
              paths:
                description: paths limits which files are synced.
                properties:
                  exclude:
                    description: |-
                      exclude lists the patterns of files to leave out, for example temporary
                      and swap files.
                    items:
                      maxLength: 512
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: patterns must be relative and must not contain '..'
                        rule: '!self.startsWith(''/'') && !(''..'' in self.split(''/''))'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  include:
                    description: |-
                      include lists the patterns of files to sync. Everything is included when
                      the list is empty.
                    items:
                      maxLength: 512
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: patterns must be relative and must not contain '..'
                        rule: '!self.startsWith(''/'') && !(''..'' in self.split(''/''))'
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              repository:
                description: repository is the Git repository to sync with.
                properties:
                  auth:
                    description: auth names the credentials for the repository.
                    properties:
                      knownHostsConfigMapRef:
                        description: |-
                          knownHostsConfigMapRef points to the ConfigMap key that holds the
                          known_hosts entries used to verify the Git host.
                        properties:
                          key:
                            description: key is the key inside the Secret or ConfigMap
                              that holds the value.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sshKeySecretRef:
                        description: sshKeySecretRef points to the Secret key that
                          holds the private SSH key.
                        properties:
                          key:
                            description: key is the key inside the Secret or ConfigMap
                              that holds the value.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  branch:
                    description: |-
                      branch is the branch to follow. The repository's default branch is used
                      when it is empty.
                    maxLength: 255
                    type: string
                    x-kubernetes-validations:
                    - message: branch must not contain '..' or '@{', start with '-'
                        or '/', or end with '.lock' or '/'
                      rule: '!self.contains(''..'') && !self.contains(''@{'') && !self.startsWith(''-'')
                        && !self.startsWith(''/'') && !self.endsWith(''.lock'') &&
                        !self.endsWith(''/'')'
                    - message: branch must not contain whitespace, control characters,
                        '~', '^', ':', '?', '*', '[' or a backslash, nor '//', a component
                        that starts with '.', or a trailing '.'
                      rule: '!self.matches(r''[\x00-\x20\x7f~^:?*\[\\]'') && !self.contains(''//'')
                        && self != ''@'' && !self.matches(r''(^|/)\.'') && !self.endsWith(''.'')'
                  path:
                    description: |-
                      path is a directory inside the repository. Only that directory is synced
                      with the volume. The whole repository is used when it is empty.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: path must be relative, must not be '.' and must not
                        contain '..', '//' or a backslash
                      rule: '!self.startsWith(''/'') && self != ''.'' && !self.contains(''\\'')
                        && !self.contains(''//'') && !(''..'' in self.split(''/''))'
                    - message: path must not end with '/' or contain a '.' or '.git'
                        segment
                      rule: '!self.endsWith(''/'') && !(''.'' in self.split(''/''))
                        && !(''.git'' in self.split(''/''))'
                  url:
                    description: |-
                      url is the address of the repository, for example
                      ssh://git@github.com/acme/dashboards.git. The scheme must be explicit;
                      the scp-style git@host:path shorthand is not accepted. Credentials never
                      go in the URL: they are supplied through auth.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: url must use an explicit ssh://, https:// or http://
                        scheme; scp-style host:path is not accepted
                      rule: isURL(self) && url(self).getScheme() in ['ssh', 'https',
                        'http']
                    - message: url must not contain whitespace or control characters
                      rule: '!self.matches(r''[\x00-\x20\x7f]'')'
                    - message: url must not embed a password; supply credentials through
                        auth
                      rule: '!self.matches(''^[a-zA-Z][a-zA-Z0-9+.-]*://[^/@]*:[^/@]*@'')'
                    - message: http and https urls must not embed credentials; supply
                        credentials through auth
                      rule: '!self.matches(''^https?://[^/]*@'')'
                required:
                - url
                type: object
              sync:
                description: sync controls the direction and timing of the sync.
                properties:
                  conflictPolicy:
                    default: followRemote
                    description: conflictPolicy says which side wins when both changed
                      the same file.
                    enum:
                    - followRemote
                    - followLocal
                    type: string
                  direction:
                    description: |-
                      direction is pull for a read-only mirror, or bidirectional to also commit
                      and push the application's edits.
                    enum:
                    - pull
                    - bidirectional
                    type: string
                  interval:
                    default: 30s
                    description: interval is how often the agent polls the repository
                      for new commits.
                    maxLength: 32
                    type: string
                    x-kubernetes-validations:
                    - message: interval must be at least 1s
                      rule: duration(self) >= duration('1s')
                  settleTime:
                    default: 5s
                    description: |-
                      settleTime is the quiet period after the last local edit before the agent
                      commits, so a file that is still being written is not committed half done.
                    maxLength: 32
                    type: string
                    x-kubernetes-validations:
                    - message: settleTime must be at least 1s
                      rule: duration(self) >= duration('1s')
                required:
                - direction
                type: object
              target:
                description: target is the volume the files live on.
                properties:
                  claimName:
                    description: |-
                      claimName is the name of an existing PersistentVolumeClaim in the same
                      namespace as the Treebind. It cannot be changed after creation.
                    maxLength: 253
                    minLength: 1
                    type: string
                  mountPath:
                    description: |-
                      mountPath is where the claim is mounted inside the sync container. It
                      does not affect where the application mounts the claim.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: mountPath must be an absolute path without '..'
                      rule: self.startsWith('/') && !('..' in self.split('/'))
                  subPath:
                    description: |-
                      subPath is a directory inside the claim. Only that directory is synced
                      with the repository. The whole claim is used when it is empty. It cannot
                      be changed after creation.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: subPath must be relative, must not be '.' and must
                        not contain '..', '//' or a backslash
                      rule: '!self.startsWith(''/'') && self != ''.'' && !self.contains(''\\'')
                        && !self.contains(''//'') && !(''..'' in self.split(''/''))'
                    - message: subPath must not end with '/' or contain a '.' or '.git'
                        segment
                      rule: '!self.endsWith(''/'') && !(''.'' in self.split(''/''))
                        && !(''.git'' in self.split(''/''))'
                required:
                - claimName
                type: object
                x-kubernetes-validations:
                - message: claimName is immutable
                  rule: self.claimName == oldSelf.claimName
                - message: subPath is immutable
                  rule: has(self.subPath) == has(oldSelf.subPath) && (!has(self.subPath)
                    || self.subPath == oldSelf.subPath)
            required:
            - repository
            - sync
            - target
            type: object
          status:
            description: status defines the observed state of Treebind
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Treebind resource. Each
                  condition has a unique type and is set by the reconciler. The status of
                  each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: lastSyncTime is when the last sync finished.
                format: date-time
                type: string
              lastSyncedCommit:
                description: |-
                  lastSyncedCommit is the commit the volume and the repository last agreed
                  on.
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the generation of the spec that the status
                  describes. A status older than metadata.generation is not up to date.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 56 characters, so the sync pod name,
            the name plus '-sync-0', fits the 63-character DNS label limit
          rule: '!has(self.metadata.name) || self.metadata.name.size() <= 56'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
