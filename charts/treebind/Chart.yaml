apiVersion: v2
name: treebind
description: Kubernetes operator that keeps a Git repository and an application's files in sync through a shared PVC
type: application

# The release workflow sets version and appVersion from the tag, without the
# leading "v". The values below only apply to a chart installed from a checkout.
version: 0.0.0-dev
appVersion: "0.0.0-dev"

kubeVersion: ">=1.35.0-0"

home: https://github.com/mohanedmoh/treebind
sources:
  - https://github.com/mohanedmoh/treebind
keywords:
  - kubernetes
  - operator
  - git
  - gitops
  - pvc
maintainers:
  - name: mohanedmoh
    url: https://github.com/mohanedmoh

# What Artifact Hub shows of the chart (https://artifacthub.io/docs/topics/annotations/helm/). The images are not listed
# here: their tag is the version of a release, which the release workflow sets and this file does not know.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: Treebind
      version: v1alpha1
      name: treebinds.treebind.example.org
      displayName: Treebind
      description: A Git repository kept in sync with the files of an application on a PersistentVolumeClaim.
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/mohanedmoh/treebind/tree/main/docs
    - name: Source
      url: https://github.com/mohanedmoh/treebind
