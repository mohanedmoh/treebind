{{- range $namespace := splitList "," (include "treebind.watchNamespaces" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if $.Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if $.Values.rbac.namespaced }}
  namespace: {{ $namespace }}
{{- end }}
  name: {{ include "treebind.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/finalizers
  - treebinds/status
  verbs:
  - update
{{- end }}
