---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: treebinds.treebind.example.org
spec:
  group: treebind.example.org
  names:
    kind: Treebind
    listKind: TreebindList
    plural: treebinds
    singular: treebind
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.conditions[?(@.type=="Conflict")].status
      name: Conflict
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Treebind is the Schema for the treebinds API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Treebind
            properties:
              agent:
                description: agent overrides how the sync pod is scheduled and run.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      annotations are added to the sync pod. An annotation that the operator sets
                      keeps the operator's value, and those of the deprecated AppArmor and seccomp
                      fields are left out.
                    maxProperties: 32
                    type: object
                  fsGroup:
                    description: |-
                      fsGroup is the group ID that owns the mounted volume, so the sync
                      container can write to a claim that the application's user created.
                      It is not applied yet: the agent refuses its own state directory once the
                      kubelet has given it to the group.
                    format: int64
                    minimum: 0
                    type: integer
                  imagePullSecrets:
                    description: |-
                      imagePullSecrets names the Secrets in the Treebind's namespace used to
                      pull the agent image.
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                      x-kubernetes-validations:
                      - message: imagePullSecrets entries need a name
                        rule: size(self.name) > 0
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      labels are added to the sync pod. A label that the operator sets keeps the
                      operator's value.
                    maxProperties: 32
                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: nodeSelector restricts the nodes the sync pod can
                      run on.
                    maxProperties: 32
                    type: object
                  priorityClassName:
                    description: priorityClassName is the priority class of the sync
                      pod.
                    maxLength: 253
                    type: string
                  resources:
                    description: |-
                      resources are the compute resources of the sync container. Each request
                      and limit takes the place of the default of its resource (requests 10m CPU
                      and 32Mi memory, limit 128Mi memory), and a default is raised or lowered so
                      that it never conflicts with what is set. claims are not applied.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  runAsGroup:
                    description: |-
                      runAsGroup is the group ID the sync pod runs as. With a runAsUser and no
                      runAsGroup the sync pod runs in group 65532, the image's, and not in group 0.
                    format: int64
                    minimum: 0
                    type: integer
                  runAsUser:
                    description: |-
                      runAsUser is the user ID the sync pod runs as. 0 is refused: the sync pod
                      runs as non-root. A user other than 65532, the image's, gives the sync pod
                      a passwd entry for it in an init container.
                    format: int64
                    minimum: 0
                    type: integer
                  tolerations:
                    description: tolerations lets the sync pod run on nodes with matching
                      taints.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              commit:
                description: commit controls the commits created from local edits.
                properties:
                  authorEmail:
                    description: |-
                      authorEmail is the email recorded as the author of every commit. It is one bare address, such as
                      bot@example.org, with no name and no comment.
                    maxLength: 254
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: authorEmail must be an address of the form name@host,
                        with no space
                      rule: self.matches(r'^[^@\s]+@[^@\s]+$')
                    - message: 'authorEmail must be a bare address: no name, no comment,
                        no ''<'' or ''>'' and no control character'
                      rule: '!self.matches(r''[<>()\x00-\x1f\x7f]'')'
                    - message: 'authorEmail must not start or end with one of . ,
                        : ; " '' \, which Git drops'
                      rule: '!self.matches(r''^[.,:;\x22\x27\x5c]|[.,:;\x22\x27\x5c]$'')'
                  authorName:
                    description: |-
                      authorName is the name recorded as the author of every commit. Git drops a newline, '<' and '>' anywhere in a
                      name, and a space, a control character and any of . , : ; " ' \ from its ends, so a name with one of them is
                      refused: the commits would say another name than the one written here.
                    maxLength: 256
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: authorName must not contain '<', '>' or a control character
                        such as a newline
                      rule: '!self.matches(r''[<>\x00-\x1f\x7f]'')'
                    - message: 'authorName must not start or end with a space or one
                        of . , : ; " '' \, which Git drops'
                      rule: '!self.matches(r''^[\x00-\x20.,:;\x22\x27\x5c]|[\x00-\x20.,:;\x22\x27\x5c]$'')'
                  maxPerHour:
                    default: 60
                    description: |-
                      maxPerHour is the most commits that the agent makes in an hour, the commits of the files that the application
                      changed and the commits that resolving a conflict makes, counted together. At the limit the agent makes no
                      more commits until one of the commits of the hour is an hour old: the changes stay on the volume, and the
                      Commit check says TooManyCommits. It is what stops a loop that the agent cannot tell from the application's own
                      work, such as an application that answers what a pull brings, from making commits for ever. Raise it when the
                      application really writes that often.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                  messageTemplate:
                    description: |-
                      messageTemplate is the commit message, as a Go text/template, with {{.Count}} for the number of files in
                      the commit. Only the built-in functions of the package are there, so a template cannot run a program or read
                      a file. The whitespace around the message is trimmed, and the first line is the subject.
                    maxLength: 4096
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: messageTemplate must not contain a NUL
                      rule: '!self.matches(r''\x00'')'
                type: object
                x-kubernetes-validations:
                - message: authorName and authorEmail must be set together
                  rule: has(self.authorName) == has(self.authorEmail)
              paths:
                description: paths limits which files are synced.
                properties:
                  exclude:
                    description: |-
                      exclude lists the patterns of the files never to commit, for example build output.
                      An exclude wins over an include.
                    items:
                      maxLength: 512
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: patterns must be relative and must not contain '..'
                        rule: '!self.startsWith(''/'') && !(''..'' in self.split(''/''))'
                      - message: 'patterns must not start with ''!'': there is no
                          negation; write ''\!'' for a name that starts with ''!'''
                        rule: '!self.startsWith(''!'')'
                      - message: patterns must not contain a NUL
                        rule: '!self.matches(r''\x00'')'
                      - message: patterns must not have an empty or '.' segment
                        rule: '!self.matches(r''(^|/)\.?/|(^|/)\.$'')'
                      - message: patterns must close each '[' within its segment,
                          must have no '[' or '/' in a class and no '\' at the end
                          or before a '/', and may have '**' only as a whole segment
                        rule: self.matches(r'^(?:(?:\*\*|\*?(?:(?:\\[^/]|\[(?:[!^](?:\]|\\[^/]|[^\\\[\]/])|\]|\\[^/]|[^\\\[\]/!^])(?:\\[^/]|[^\\\[\]/])*\]|[^\\\[*/])\*?)*)(?:/|$))+$')
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: the patterns of a list must have at most 16384 characters
                        in all
                      rule: self.map(p, size(p)).sum() <= 16384
                  include:
                    description: |-
                      include lists the patterns of the files to commit. Every file is included when the
                      list is empty.
                    items:
                      maxLength: 512
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: patterns must be relative and must not contain '..'
                        rule: '!self.startsWith(''/'') && !(''..'' in self.split(''/''))'
                      - message: 'patterns must not start with ''!'': there is no
                          negation; write ''\!'' for a name that starts with ''!'''
                        rule: '!self.startsWith(''!'')'
                      - message: patterns must not contain a NUL
                        rule: '!self.matches(r''\x00'')'
                      - message: patterns must not have an empty or '.' segment
                        rule: '!self.matches(r''(^|/)\.?/|(^|/)\.$'')'
                      - message: patterns must close each '[' within its segment,
                          must have no '[' or '/' in a class and no '\' at the end
                          or before a '/', and may have '**' only as a whole segment
                        rule: self.matches(r'^(?:(?:\*\*|\*?(?:(?:\\[^/]|\[(?:[!^](?:\]|\\[^/]|[^\\\[\]/])|\]|\\[^/]|[^\\\[\]/!^])(?:\\[^/]|[^\\\[\]/])*\]|[^\\\[*/])\*?)*)(?:/|$))+$')
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: the patterns of a list must have at most 16384 characters
                        in all
                      rule: self.map(p, size(p)).sum() <= 16384
                type: object
              placement:
                default:
                  mode: standalone
                description: |-
                  placement says where the sync pod runs. It is defaulted as a whole so a
                  Treebind without it reads back as standalone.
                properties:
                  appSelector:
                    description: |-
                      appSelector selects the pods of the application that uses the claim, in the
                      namespace of the Treebind. Name pods that mount the claim, and only those.
                      Unless the claim lists ReadWriteMany, or only ReadOnlyMany, the sync pod
                      gets a required pod affinity to them, so that it runs on their node: it is
                      Pending while there is none. A claim that is not there counts as one that
                      one node mounts. Sync pods are never counted as the application's. The
                      affinity holds when the sync pod is scheduled; the sync pod does not follow
                      an application that moves to another node later. Without appSelector the
                      scheduler puts the sync pod anywhere.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: 'appSelector needs an entry in matchLabels or matchExpressions:
                        an empty selector would match every pod'
                      rule: (has(self.matchLabels) && size(self.matchLabels) > 0)
                        || (has(self.matchExpressions) && size(self.matchExpressions)
                        > 0)
                  mode:
                    default: standalone
                    description: |-
                      mode is standalone to run the sync pod on its own, or sidecar to run the
                      sync container inside the application's pods. sidecar is not implemented
                      yet: the sync pod runs on its own, and the SpecSupported condition says so.
                    enum:
                    - standalone
                    - sidecar
                    type: string
                type: object
              repository:
                description: repository is the Git repository to sync with.
                properties:
                  auth:
                    description: auth names the credentials for the repository.
                    properties:
                      knownHostsConfigMapRef:
                        description: |-
                          knownHostsConfigMapRef points to the ConfigMap key that holds the
                          known_hosts entries used to verify the Git host. It is required when the
                          repository url uses ssh://, because host keys are always verified.
                        properties:
                          key:
                            description: key is the key inside the Secret or ConfigMap
                              that holds the value.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sshKeySecretRef:
                        description: |-
                          sshKeySecretRef points to the Secret key that holds the private SSH key.
                          It is required when the repository url uses ssh://.
                        properties:
                          key:
                            description: key is the key inside the Secret or ConfigMap
                              that holds the value.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  branch:
                    description: |-
                      branch is the branch to follow. The repository's default branch is used
                      when it is empty.
                    maxLength: 255
                    type: string
                    x-kubernetes-validations:
                    - message: branch must not contain '..' or '@{', start with '-'
                        or '/', or end with '.lock' or '/'
                      rule: '!self.contains(''..'') && !self.contains(''@{'') && !self.startsWith(''-'')
                        && !self.startsWith(''/'') && !self.endsWith(''.lock'') &&
                        !self.endsWith(''/'')'
                    - message: branch must not contain whitespace, control characters,
                        '~', '^', ':', '?', '*', '[' or a backslash, nor '//', a component
                        that starts with '.', or a trailing '.'
                      rule: '!self.matches(r''[\x00-\x20\x7f~^:?*\[\\]'') && !self.contains(''//'')
                        && self != ''@'' && !self.matches(r''(^|/)\.'') && !self.endsWith(''.'')'
                  path:
                    description: |-
                      path is a directory inside the repository. Only that directory is synced
                      with the volume: its files are the files of the synced directory, at the
                      root of it (target.subPath, or the whole claim), and nothing else of the
                      repository is written to the volume. The patterns of paths are relative to
                      it. The whole repository is used when it is empty. The branch has to have
                      the directory when the Treebind starts, so that a mistake in the name does
                      not make the agent commit the application's files into a new directory of
                      the repository. A commit of the agent changes the files of the directory
                      and nothing outside it.

                      A volume that is synced with the whole repository is not changed to
                      sync only a directory of it, nor the other way round: the agent refuses
                      to start it, with every file where it is, and says how to keep what is
                      there and how to start again.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: path must be relative, must not be '.' and must not
                        contain '..', '//' or a backslash
                      rule: '!self.startsWith(''/'') && self != ''.'' && !self.contains(''\\'')
                        && !self.contains(''//'') && !(''..'' in self.split(''/''))'
                    - message: path must not end with '/' or contain a '.' or '.git'
                        segment
                      rule: '!self.endsWith(''/'') && !(''.'' in self.split(''/''))
                        && !(''.git'' in self.split(''/''))'
                  url:
                    description: |-
                      url is the address of the repository, for example
                      ssh://git@github.com/acme/dashboards.git. The scheme must be explicit;
                      the scp-style git@host:path shorthand is not accepted. Credentials never
                      go in the URL: they are supplied through auth.
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: url must use an explicit ssh://, https:// or http://
                        scheme; scp-style host:path is not accepted
                      rule: isURL(self) && url(self).getScheme() in ['ssh', 'https',
                        'http']
                    - message: url must not contain whitespace or control characters
                      rule: '!self.matches(r''[\x00-\x20\x7f]'')'
                    - message: url must not embed a password; supply credentials through
                        auth
                      rule: '!self.matches(''^[a-zA-Z][a-zA-Z0-9+.-]*://[^/@]*:[^/@]*@'')'
                    - message: http and https urls must not embed credentials; supply
                        credentials through auth
                      rule: '!self.matches(''^https?://[^/]*@'')'
                required:
                - url
                type: object
                x-kubernetes-validations:
                - message: an ssh:// repository needs auth.sshKeySecretRef and auth.knownHostsConfigMapRef;
                    host keys are always verified
                  rule: '!isURL(self.url) || url(self.url).getScheme() != ''ssh''
                    || (has(self.auth) && has(self.auth.sshKeySecretRef) && has(self.auth.knownHostsConfigMapRef))'
              sync:
                description: sync controls the direction and timing of the sync.
                properties:
                  conflictPolicy:
                    default: followRemote
                    description: conflictPolicy says which side wins when both changed
                      the same file.
                    enum:
                    - followRemote
                    - followLocal
                    type: string
                  direction:
                    description: |-
                      direction is pull for a read-only mirror, or bidirectional to also commit
                      and push the application's edits.
                    enum:
                    - pull
                    - bidirectional
                    type: string
                  interval:
                    default: 30s
                    description: interval is how often the agent polls the repository
                      for new commits.
                    maxLength: 32
                    type: string
                    x-kubernetes-validations:
                    - message: interval must be at least 1s
                      rule: duration(self) >= duration('1s')
                  maxDeletions:
                    description: |-
                      maxDeletions is the most files that one update may remove from the directory. An update that
                      would remove more is not applied: the agent says so, and asks again at every interval. The
                      agent applies up to 100 when this is not set. Raise it to let through an update that removes
                      more files, or remove the files yourself. An update that would leave the repository with no
                      file at all is refused whatever this says.
                    format: int32
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  settleTime:
                    default: 5s
                    description: |-
                      settleTime is the quiet period after the last local edit before the agent
                      commits, so a file that is still being written is not committed half done.
                    maxLength: 32
                    type: string
                    x-kubernetes-validations:
                    - message: settleTime must be at least 1s
                      rule: duration(self) >= duration('1s')
                required:
                - direction
                type: object
              target:
                description: target is the volume the files live on.
                properties:
                  claimName:
                    description: |-
                      claimName is the name of an existing PersistentVolumeClaim in the same
                      namespace as the Treebind. It cannot be changed after creation.
                    maxLength: 253
                    minLength: 1
                    type: string
                  mountPath:
                    description: |-
                      mountPath is where the claim is mounted inside the sync container. It
                      does not affect where the application mounts the claim.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: mountPath must be an absolute path without '..'
                      rule: self.startsWith('/') && !('..' in self.split('/'))
                  subPath:
                    description: |-
                      subPath is a directory inside the claim. Only that directory is synced
                      with the repository. The whole claim is used when it is empty. It cannot
                      be changed after creation.

                      The sync agent keeps its Git directory and the rest of its own state in a
                      directory called .treebind at the root of the claim. With a subPath it is
                      beside the synced directory, so an application that mounts the claim with
                      the same subPath does not see it. Without one it is inside the synced
                      directory, where the application can see it. So an application should mount
                      only the subPath, and the subPath cannot start with .treebind.
                    maxLength: 1024
                    type: string
                    x-kubernetes-validations:
                    - message: subPath must be relative, must not be '.' and must
                        not contain '..', '//' or a backslash
                      rule: '!self.startsWith(''/'') && self != ''.'' && !self.contains(''\\'')
