apiVersion: treebind.example.org/v1alpha1
kind: Treebind
metadata:
  labels:
    app.kubernetes.io/name: treebind
    app.kubernetes.io/managed-by: kustomize
  name: treebind-sample
spec:
  repository:
    url: ssh://git@github.com/acme/dashboards.git
    branch: main
    # An ssh:// repository needs both references, because host keys are always
    # verified. Create the ConfigMap from the host's keys:
    #   ssh-keyscan github.com > known_hosts
    #   kubectl create configmap git-known-hosts --from-file=known_hosts
    auth:
      sshKeySecretRef:
        name: dashboards-deploy-key
        key: id_ed25519
      knownHostsConfigMapRef:
        name: git-known-hosts
        key: known_hosts
  target:
    claimName: grafana-data
    subPath: dashboards
    mountPath: /work
  sync:
    direction: bidirectional
    interval: 30s
    settleTime: 5s
    conflictPolicy: followRemote
  commit:
    authorName: treebind
    authorEmail: treebind@example.org
    messageTemplate: "treebind: sync {{ .Count }} file(s)"
    maxPerHour: 60
  paths:
    exclude:
      - "*.tmp"
      - "*.swp"
  placement:
    mode: standalone
    # On a ReadWriteOnce claim, name the pods of the application that mounts it, and only
    # those: the sync pod then runs on their node, and is Pending while there is none
    # (docs/storage-support.md#access-modes-and-where-the-sync-pod-runs).
    # appSelector:
    #   matchLabels:
    #     app.kubernetes.io/name: grafana
  # The agent block overrides parts of the sync pod (docs/pod-security.md). fsGroup is
  # accepted but not applied yet. A runAsUser changes who owns the agent's state
  # directory, .treebind, on the claim: on a claim the agent used before as another
  # user, the agent refuses it until it is given to the new user.
  # agent:
  #   resources:
  #     requests:
  #       cpu: 50m
  #       memory: 64Mi
  #     limits:
  #       memory: 128Mi
  #   nodeSelector:
  #     kubernetes.io/os: linux
  #   tolerations:
  #     - key: dedicated
  #       operator: Equal
  #       value: storage
  #       effect: NoSchedule
  #   priorityClassName: background
  #   imagePullSecrets:
  #     - name: registry-credentials
  #   labels:
  #     team: storage
  #   annotations:
  #     owner: storage-team
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 2000
