---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/finalizers
  verbs:
  - update
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/status
  verbs:
  - get
  - patch
  - update
