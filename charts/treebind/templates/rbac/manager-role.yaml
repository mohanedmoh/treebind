apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "treebind.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/finalizers
  verbs:
  - update
- apiGroups:
  - treebind.example.org
  resources:
  - treebinds/status
  verbs:
  - get
  - patch
  - update
